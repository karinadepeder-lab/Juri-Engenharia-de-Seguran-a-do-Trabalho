<index.htmll>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz NR 35</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F5B800">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: uma coluna de bolso, faixa de sinalização zebrada no topo, cartão de pergunta com alternativas grandes para o polegar */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --ink:#1C1D1F; --muted:#5D5F63; --line:#DAD8D1;
  --hazard:#F5B800; --hazard-ink:#1C1D1F;
  --ok:#1F7A3D; --ok-bg:#E3F2E7; --bad:#B42318; --bad-bg:#FBE6E3;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141518; --surface:#1E2024; --ink:#ECEBE6; --muted:#A3A5AA; --line:#33363C;
  --hazard:#F5B800; --hazard-ink:#141518;
  --ok:#5CC981; --ok-bg:#16301F; --bad:#FF8A7A; --bad-bg:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141518; --surface:#1E2024; --ink:#ECEBE6; --muted:#A3A5AA; --line:#33363C;
  --hazard:#F5B800; --hazard-ink:#141518;
  --ok:#5CC981; --ok-bg:#16301F; --bad:#FF8A7A; --bad-bg:#3A1A17; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hazard)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 14px,var(--hazard-ink) 14px 28px)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;
  display:flex;flex-direction:column;gap:8px}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tag{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.count{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--hazard);transition:width .3s}

h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,58px);line-height:.95;
  text-transform:uppercase;margin:24px 0 12px;text-wrap:balance}
h1 em{font-style:normal;background:var(--hazard);color:var(--hazard-ink);padding:0 .12em}
.lead{color:var(--muted);margin:0 0 20px;max-width:34em}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 24px}
.fact{border:2px solid var(--ink);padding:10px 8px;text-align:center}
.fact b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.fact small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

label.fl{display:block;font-weight:600;margin-bottom:6px}
input[type=text]{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:6px;
  background:var(--surface);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--hazard)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.mode{font:inherit;text-align:left;padding:14px;border:2px solid var(--line);border-radius:6px;background:var(--surface);
  color:var(--ink);cursor:pointer}
.mode b{display:block;font-family:var(--display);font-size:22px;text-transform:uppercase}
.mode span{font-size:14px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--hazard)}

.btn{display:block;width:100%;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;
  text-transform:uppercase;padding:16px;border:0;border-radius:6px;background:var(--hazard);color:var(--hazard-ink);cursor:pointer;
  min-height:56px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.mode:focus-visible,.opt:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}

.module{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:14px;
  display:inline-block;background:var(--ink);color:var(--bg);padding:3px 8px;margin-top:16px}
.q{font-family:var(--display);font-weight:700;font-size:clamp(25px,7vw,30px);line-height:1.12;margin:12px 0 18px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);
  background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:14px;cursor:pointer;min-height:56px}
.opt .k{flex:none;width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;
  font-family:var(--display);font-weight:800;font-size:17px}
.opt .t{min-width:0;padding-top:2px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}

.fb{margin:16px 0;padding:14px 16px;border-left:6px solid var(--ok);background:var(--surface);border-radius:0 6px 6px 0}
.fb.no{border-color:var(--bad)}
.fb h3{margin:0 0 4px;font-family:var(--display);font-size:22px;text-transform:uppercase;color:var(--ok)}
.fb.no h3{color:var(--bad)}
.fb p{margin:0}
.fb .src{margin-top:8px;font-size:13px;color:var(--muted)}
.foot{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}

.score{margin:24px 0 8px;border:3px solid var(--ink);background:var(--surface)}
.score .hd{background:var(--hazard);color:var(--hazard-ink);font-family:var(--display);font-weight:800;text-transform:uppercase;
  letter-spacing:.06em;padding:8px 14px;font-size:16px}
.score .bd{padding:16px 14px;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--display);font-weight:800;font-size:72px;line-height:.9;font-variant-numeric:tabular-nums}
.big small{font-size:32px;color:var(--muted)}
.verdict{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase}
.meta{font-size:14px;color:var(--muted)}
h2{font-family:var(--display);font-size:26px;text-transform:uppercase;margin:28px 0 10px}
.rev{display:flex;flex-direction:column;gap:10px}
.ri{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.ri p{margin:0 0 6px}
.ri .a{font-size:15px}
.ri .a b{color:var(--ok)}
.ri .y{font-size:15px;color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.closing{margin-top:28px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.comic{margin:14px 0 0;display:grid;gap:8px}
.comic svg{display:block;width:100%;height:auto;max-width:100%}
.case{margin:12px 0 0;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:6px;padding:10px 12px}
.case b{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--muted);display:block}
.ri svg{display:block;width:100%;max-width:260px;height:auto;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"></div>
<div class="wrap" id="app"></div>

<script>
/* ---------- Motor de quadrinhos (SVG desenhado no próprio app) ---------- */
const K="#1C1D1F", ORG="#E8590C", SLAB="#C9CDD1", WALL="#DADDE0", SKIN=["#E9B48A","#B97A4F","#8A5A3C","#F1C9A5"];
let PID=0;
const FONT='font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="700"';

function W(x,y,o={}){
  const s=o.flip?-1:1, p=o.pose||"stand";
  const legs = o.legs==="walk"?"M-10,0 L0,-26 L9,-1": o.hang?"M-6,5 L0,-26 L4,7":"M-7,0 L0,-26 L7,0";
  const arms = {
    stand:"M-8,-46 L-12,-28 M8,-46 L12,-28", reach:"M-8,-46 L-12,-28 M8,-46 L22,-60",
    point:"M-8,-46 L-12,-28 M8,-46 L27,-52", carry:"M-8,-46 L10,-36 M8,-46 L16,-36",
    box:"M-8,-46 L10,-38 M8,-46 L16,-38", head:"M-8,-46 L-12,-28 M8,-46 Q16,-60 7,-68",
    cross:"M-9,-44 L8,-37 M9,-44 L-8,-37", up:"M-8,-46 L-4,-80 M8,-46 L4,-80",
    hold:"M-8,-46 L-14,-70 M8,-46 L14,-70", clip:"M-8,-46 L-12,-28 M8,-46 L18,-40"
  }[p];
  const extra = {
    carry:`<rect x="4" y="-42" width="34" height="6" fill="#C68B4E" stroke="${K}" stroke-width="2"/>`,
    box:`<rect x="6" y="-50" width="22" height="18" fill="#C68B4E" stroke="${K}" stroke-width="2"/>`,
    hold:`<rect x="-26" y="-76" width="52" height="6" fill="#9AA3AD" stroke="${K}" stroke-width="2"/>`,
    clip:`<rect x="14" y="-54" width="16" height="20" fill="#F0EAD6" stroke="${K}" stroke-width="2"/><text x="22" y="-40" text-anchor="middle" font-size="8" ${FONT} fill="${K}">PT</text>`
  }[p]||"";
  const m=o.mood||"ok";
  let face=`<circle cx="3" cy="-61" r="1.5" fill="${K}"/><circle cx="7" cy="-61" r="1.5" fill="${K}"/>`;
  if(m==="dizzy") face=`<path d="M1,-63 L5,-59 M5,-63 L1,-59 M6,-63 L9,-59 M9,-63 L6,-59" stroke="${K}" stroke-width="1.4"/>`;
  const mouth={ok:"M2,-55 Q5,-52 8,-55",worried:"M2,-54 Q5,-57 8,-54",dizzy:"M3,-54 Q5,-56 7,-54",firm:"M2,-55 L8,-55"}[m];
  const sweat = (m==="worried"||m==="dizzy")?`<path d="M-13,-66 Q-16,-60 -13,-58 Q-10,-60 -13,-66Z" fill="#6EC1E4" stroke="${K}" stroke-width="1"/>`:"";
  const spin = m==="dizzy"?`<path d="M-6,-80 q4,-6 8,0 q4,6 8,0" stroke="${K}" stroke-width="1.6" fill="none"/>`:"";
  const old = o.old?`<path d="M1,-57 Q5,-54 9,-57" stroke="#8C8C8C" stroke-width="3" fill="none"/>`:"";
  const harness = o.h?`<path d="M-7,-49 L6,-29 M7,-49 L-6,-29 M-8,-27 L8,-27" stroke="${ORG}" stroke-width="3" fill="none"/>`:"";
  return `<g transform="translate(${x},${y}) scale(${s},1)">
    <path d="${legs}" stroke="#34404E" stroke-width="6" stroke-linecap="round" fill="none"/>
    <rect x="-8" y="-50" width="16" height="26" rx="4" fill="${o.shirt||"#2F6FB0"}" stroke="${K}" stroke-width="2.5"/>
    ${harness}
    <path d="${arms}" stroke="${K}" stroke-width="4" stroke-linecap="round" fill="none"/>
    ${extra}
    <circle cx="0" cy="-60" r="9" fill="${o.skin||SKIN[0]}" stroke="${K}" stroke-width="2.5"/>
    ${face}<path d="${mouth}" stroke="${K}" stroke-width="1.6" fill="none"/>${old}${sweat}${spin}
    <path d="M-10,-63 A10,10 0 0 1 10,-63 Z" fill="${o.hat||"#F5B800"}" stroke="${K}" stroke-width="2.5"/>
    <path d="M-11,-63 L14,-63" stroke="${K}" stroke-width="3" stroke-linecap="round"/>
  </g>`;
}
const lan=(x1,y1,x2,y2,sag=10)=>`<path d="M${x1},${y1} Q${(x1+x2)/2},${Math.max(y1,y2)+sag} ${x2},${y2}" stroke="${ORG}" stroke-width="3" fill="none"/>`;
const ring=(x,y)=>`<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="${K}" stroke-width="3"/>`;
function balloon(x,y,w,lines,tx,ty){
  const h=lines.length*15+12, below=ty>y+h, by=below?y+h:y;
  const bx=Math.min(Math.max(tx,x+18),x+w-18);
  return `<polygon points="${bx-8},${by} ${bx+8},${by} ${tx},${ty}" fill="#fff" stroke="${K}" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="13" fill="#fff" stroke="${K}" stroke-width="2.5"/>
  <line x1="${bx-6}" y1="${by+(below?-1.3:1.3)}" x2="${bx+6}" y2="${by+(below?-1.3:1.3)}" stroke="#fff" stroke-width="3.5"/>
  ${lines.map((l,i)=>`<text x="${x+w/2}" y="${y+20+i*15}" text-anchor="middle" font-size="14" ${FONT} fill="${K}">${l}</text>`).join("")}`;
}
const caption=t=>`<rect x="6" y="6" width="${t.length*7.3+18}" height="20" fill="#F5B800" stroke="${K}" stroke-width="2"/><text x="14" y="20" font-size="11.5" ${FONT} letter-spacing=".6" fill="${K}">${t.toUpperCase()}</text>`;
function burst(x,y){let pts=[];for(let i=0;i<16;i++){const r=i%2?8:16,a=i*Math.PI/8;pts.push((x+r*Math.cos(a)).toFixed(1)+","+(y+r*Math.sin(a)).toFixed(1))}
  return `<polygon points="${pts.join(" ")}" fill="#E5484D" stroke="${K}" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" ${FONT} fill="#fff">!</text>`;}
const slab=(x0,x1,y)=>`<rect x="${x0}" y="${y+12}" width="${x1-x0}" height="${200-y}" fill="${WALL}" stroke="${K}" stroke-width="2.5"/><rect x="${x0}" y="${y}" width="${x1-x0}" height="12" fill="${SLAB}" stroke="${K}" stroke-width="2.5"/>`;
const ground=(y,c="#D9C7A8")=>`<rect x="0" y="${y}" width="300" height="${200-y}" fill="${c}" stroke="${K}" stroke-width="2.5"/>`;
function rain(){let s="";for(let r=0;r<6;r++)for(let x=10+(r%2)*9;x<300;x+=18){const y=10+r*30;s+=`<line x1="${x}" y1="${y}" x2="${x-6}" y2="${y+14}" stroke="#4A78A8" stroke-width="2" stroke-linecap="round"/>`}return s;}
const wind=()=>[50,78,104].map(y=>`<path d="M8,${y} q30,-12 60,0 t60,0" stroke="#7D8A98" stroke-width="3" fill="none" stroke-linecap="round"/>`).join("");
const sun=(x,y)=>`<circle cx="${x}" cy="${y}" r="16" fill="#FFD43B" stroke="${K}" stroke-width="2.5"/>`;

function panel(inner,sky="#FFFFFF",label=""){
  const id="d"+(++PID);
  return `<svg viewBox="0 0 300 200" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">
  <defs><pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#000" opacity=".08"/></pattern></defs>
  <rect width="300" height="200" fill="${sky}"/><rect width="300" height="200" fill="url(#${id})"/>
  ${inner}<rect x="2" y="2" width="296" height="196" fill="none" stroke="${K}" stroke-width="4"/></svg>`;
}

const SCENES = {
 laje:()=>[panel(`${slab(0,212,144)}
   ${[24,48,72,96,120,144,168].map(x=>`<line x1="${x}" y1="144" x2="${x}" y2="126" stroke="#8A5A3C" stroke-width="2"/>`).join("")}
   <line x1="20" y1="132" x2="172" y2="132" stroke="#8A5A3C" stroke-width="2"/>
   <line x1="212" y1="192" x2="300" y2="192" stroke="${K}" stroke-width="2"/><rect x="250" y="184" width="22" height="8" rx="2" fill="#5B8DB8" stroke="${K}" stroke-width="1.5"/>
   ${W(190,144,{pose:"carry"})}${burst(268,128)}
   ${balloon(18,38,140,["É rapidinho,","nem precisa de","proteção!"],180,90)}${caption("4º andar · 7h10")}`,"#DCEFFB","Trabalhador carregando tábua na borda da laje sem guarda-corpo")],
 chuva:()=>[
   panel(`${sun(255,42)}${slab(0,300,144)}<rect x="76" y="104" width="8" height="40" fill="#7A7F86" stroke="${K}" stroke-width="2"/>${ring(80,100)}
     ${lan(160,98,80,100,14)}${W(160,144,{h:1,pose:"reach"})}${balloon(168,52,118,["Ancorado e","com PT!"],168,80)}${caption("10h · sol")}`,"#DCEFFB","Trabalhador ancorado com tempo bom"),
   panel(`${rain()}${wind()}${slab(0,300,144)}<rect x="76" y="104" width="8" height="40" fill="#7A7F86" stroke="${K}" stroke-width="2"/>${ring(80,100)}
     ${lan(160,98,80,100,14)}${W(160,144,{h:1,mood:"worried"})}${balloon(160,36,130,["Falta pouco,","vou terminar!"],166,78)}${caption("10h40 · chuva e vento")}`,"#B9C2CC","Começa a chover e ventar; trabalhador quer terminar")],
 tontura:()=>[panel(`${ground(170)}
   <line x1="226" y1="170" x2="226" y2="0" stroke="${K}" stroke-width="3"/><line x1="254" y1="170" x2="254" y2="0" stroke="${K}" stroke-width="3"/>
   ${[156,136,116,96,76,56,36,16].map(y=>`<line x1="226" y1="${y}" x2="254" y2="${y}" stroke="${K}" stroke-width="3"/>`).join("")}
   ${W(66,170,{pose:"clip",shirt:"#4E5D6C",hat:"#FFFFFF",skin:SKIN[1]})}${W(178,170,{pose:"head",mood:"dizzy",flip:1,h:1})}
   ${balloon(6,34,108,["Sobe aí,","é rapidinho."],64,100)}${balloon(140,30,82,["Tô tonto,","mas o ASO","tá em dia!"],176,98)}${caption("início do turno")}`,"#EAF4FB","Trabalhador tonto ao pé da escada; supervisor com a PT manda subir")],
 cano:()=>[panel(`${slab(0,300,144)}<rect x="236" y="94" width="7" height="50" fill="#EDEDED" stroke="${K}" stroke-width="2"/>
   <path d="M237,112 l4,4 l-3,3" stroke="${K}" stroke-width="1.4" fill="none"/>${lan(170,98,240,98,10)}
   ${W(170,144,{h:1,pose:"reach"})}${burst(270,84)}${balloon(14,40,120,["Esse cano","aguenta!"],160,82)}${caption("ponto de ancoragem?")}`,"#DCEFFB","Trabalhador prende o talabarte num cano de PVC")],
 chave:()=>[panel(`${slab(0,175,85)}${[20,70,120].map(x=>`<rect x="${x}" y="115" width="26" height="24" fill="#AFC6DA" stroke="${K}" stroke-width="2"/>`).join("")}
   ${ground(188)}${W(135,85,{pose:"reach",mood:"worried"})}
   <line x1="190" y1="96" x2="190" y2="112" stroke="${K}" stroke-width="2"/><line x1="198" y1="100" x2="198" y2="114" stroke="${K}" stroke-width="2"/>
   <g transform="translate(194,130) rotate(35)"><rect x="-3" y="-12" width="6" height="22" fill="#9AA3AD" stroke="${K}" stroke-width="2"/><circle cx="0" cy="-14" r="6" fill="#9AA3AD" stroke="${K}" stroke-width="2"/></g>
   ${W(238,188,{pose:"box",flip:1,skin:SKIN[2],old:1})}${balloon(180,10,110,["Opa! A chave","escapou!"],148,30)}${caption("sem isolamento")}`,"#EAF4FB","Ferramenta cai do andar de cima sobre área sem isolamento")],
 suspenso:()=>[panel(`${ground(186)}<rect x="30" y="34" width="240" height="14" fill="#6B7280" stroke="${K}" stroke-width="2.5"/>
   ${ring(170,54)}<line x1="170" y1="59" x2="170" y2="72" stroke="${ORG}" stroke-width="3"/>
   ${W(170,150,{h:1,pose:"up",mood:"dizzy",hang:1})}${W(58,186,{pose:"point",skin:SKIN[1]})}
   ${balloon(6,56,124,["Calma! Vamos","esperar os","bombeiros..."],60,110)}${caption("suspenso há 10 min")}`,"#EAF4FB","Trabalhador suspenso pelo cinto enquanto colega diz para esperar")],
 poco:()=>[panel(`${slab(0,300,154)}<rect x="210" y="54" width="70" height="146" fill="#26282C" stroke="${K}" stroke-width="3"/>
   <path d="M216,60 L216,194 M274,60 L274,194" stroke="#44474D" stroke-width="2"/>
   ${W(160,154,{pose:"box",legs:"walk"})}${burst(245,100)}${balloon(10,46,136,["Deixo o material","lá dentro..."],150,96)}${caption("poço do elevador")}`,"#EAF4FB","Trabalhador caminha para o vão aberto do poço do elevador")],

const CASES=BANK.filter(q=>q.c).length;
const app=document.getElementById("app");
const state={name:"",mode:"casos",list:[],i:0,picks:[]};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L="ABCD";
const comic=(q,first)=>q.c?SCENES[q.c]().slice(0,first?1:9).join(""):"";

function build(){
  const pool=state.mode==="casos"?BANK.filter(q=>q.c):BANK;
  state.list=shuffle(pool).map(q=>{const order=shuffle(q.o.map((t,k)=>({t,k})));return{...q,opts:order,ans:order.findIndex(x=>x.k===q.a)};});
  state.i=0;state.picks=[];question();
}

function start(){
  PID=0;
  app.innerHTML=`
  <h1>Trabalho em <em>altura</em> não perdoa</h1>
  <p class="lead">Quiz da aula “NR 35: O Perigo Invisível do Trabalho em Altura”. Cada estudo de caso mostra uma situação real de obra em quadrinhos: decida o que deveria ser feito.</p>
  <div class="comic">${SCENES.recusa()[0]}</div>
  <div class="facts" aria-label="Números da aula" style="margin-top:16px">
    <div class="fact"><b>2,0 m</b><small>Altura NR 35</small></div>
    <div class="fact"><b>1.500</b><small>kgf ancoragem</small></div>
    <div class="fact"><b>&lt;15 min</b><small>Suspensão inerte</small></div>
  </div>
  <label class="fl" for="nome">Seu nome</label>
  <input type="text" id="nome" autocomplete="name" placeholder="Ex.: João da Silva" value="${esc(state.name)}">
  <div class="modes" role="group" aria-label="Tipo de quiz">
    <button class="mode" id="mC" aria-pressed="${state.mode==="casos"}"><b>Estudos de caso</b><span>${CASES} situações em quadrinhos</span></button>
    <button class="mode" id="mA" aria-pressed="${state.mode==="todos"}"><b>Completo</b><span>${BANK.length} questões, casos e conceitos</span></button>
  </div>
  <button class="btn" id="go">Começar</button>
  <p class="closing">Se não estiver 100% seguro, ninguém sobe.</p>`;
  const mC=document.getElementById("mC"),mA=document.getElementById("mA");
  mC.onclick=()=>{state.mode="casos";mC.setAttribute("aria-pressed","true");mA.setAttribute("aria-pressed","false")};
  mA.onclick=()=>{state.mode="todos";mA.setAttribute("aria-pressed","true");mC.setAttribute("aria-pressed","false")};
  document.getElementById("go").onclick=()=>{state.name=document.getElementById("nome").value.trim();build();};
}

function question(){
  const q=state.list[state.i],n=state.list.length;
  app.innerHTML=`
  <header class="top">
    <div class="toprow"><span class="tag">Quiz NR 35</span><span class="count">${state.i+1}/${n}</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${state.i}"><span style="width:${state.i/n*100}%"></span></div>
  </header>
  <span class="module">${esc(q.m)}</span>
  ${q.c?`<div class="comic">${comic(q,false)}</div>`:""}
  ${q.n?`<p class="case"><b>A situação</b>${esc(q.n)}</p>`:""}
  <p class="q">${esc(q.q)}</p>
  <ul class="opts">${q.opts.map((o,k)=>`<li><button class="opt" data-k="${k}"><span class="k">${L[k]}</span><span class="t">${esc(o.t)}</span></button></li>`).join("")}</ul>
  <div id="fb"></div>
  <div class="foot"><button class="btn" id="next" disabled>${state.i+1<n?"Próxima":"Ver resultado"}</button></div>`;
  window.scrollTo(0,0);
  const btns=[...app.querySelectorAll(".opt")];
  btns.forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,ok=k===q.ans;
    state.picks[state.i]=k;
    btns.forEach((x,j)=>{x.disabled=true;if(j===q.ans)x.classList.add("right");else if(j===k)x.classList.add("wrong");else x.classList.add("dim");});
    document.getElementById("fb").innerHTML=`<div class="fb ${ok?"":"no"}" role="status">
      <h3>${ok?"Correto":"Atenção"}</h3><p>${ok?"":`Resposta certa: <b>${esc(q.opts[q.ans].t)}</b>. `}${esc(q.e)}</p>
      <p class="src">Referência: ${esc(q.s)} da aula</p></div>`;
    const nx=document.getElementById("next");nx.disabled=false;
    document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
  });
  document.getElementById("next").onclick=()=>{state.i++;state.i<n?question():result();};
}

function result(){
  const n=state.list.length,hits=state.list.filter((q,i)=>state.picks[i]===q.ans).length,pct=Math.round(hits/n*100);
  const verdict=pct>=90?"Pronto para o campo":pct>=70?"Aprovado, revise os pontos abaixo":"Revise a aula antes de subir";
  const now=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
  const misses=state.list.map((q,i)=>({q,p:state.picks[i]})).filter(x=>x.p!==x.q.ans);
  app.innerHTML=`
  <div class="score"><div class="hd">Resultado · NR 35</div><div class="bd">
    <div class="big">${hits}<small>/${n}</small></div><div class="verdict">${verdict}</div>
    <div class="meta">${state.name?esc(state.name)+" · ":""}${pct}% de acertos · ${now}</div></div></div>
  <p class="meta">Mostre esta tela à professora como comprovante.</p>
  ${misses.length?`<h2>Para revisar (${misses.length})</h2><div class="rev">${misses.map(({q,p})=>`
    <div class="ri">${q.c?comic(q,true):""}<p><b>${esc(q.q)}</b></p>
    <p class="y">Sua resposta: ${esc(q.opts[p].t)}</p><p class="a">Certa: <b>${esc(q.opts[q.ans].t)}</b></p>
    <p class="meta">${esc(q.e)} (${esc(q.s)})</p></div>`).join("")}</div>`
   :`<h2>Gabarito perfeito</h2><p>Você acertou todas. Leve essa atenção para cada turno.</p>`}
  <div class="stack"><button class="btn" id="again">Refazer em nova ordem</button><button class="btn ghost" id="home">Voltar ao início</button></div>
  <p class="closing">“Quando edificares uma casa nova, farás um parapeito em torno do terraço…” (Deuteronômio 22:8)</p>`;
  window.scrollTo(0,0);
  document.getElementById("again").onclick=build;
  document.getElementById("home").onclick=start;
}
start();
</script>
</body>
</html>
